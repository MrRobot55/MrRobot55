# =============================================================================
#  mrrobot55.fr — config nginx du conteneur (montée sur default.conf)
#  Le dépôt entier est monté comme racine web : on ne sert que le contenu du
#  site, jamais .git, la config Docker/nginx ni la doc du dépôt.
# =============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    # Fichiers cachés (.git, .env, .gitignore…)
    location ~ /\. {
        return 404;
    }

    # Fichiers du dépôt qui ne font pas partie du site
    location ~* \.(ya?ml|md|conf|sh|bak|log)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
